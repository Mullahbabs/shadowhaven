              const matchesName = p.name.toLowerCase().includes(query);
              const matchesDesc = p.shortDesc.toLowerCase().includes(query);
              const matchesFullDesc = p.fullDesc.toLowerCase().includes(query);
              const matchesCategory = p.category.toLowerCase().includes(query);
              if (
                !matchesName &&
                !matchesDesc &&
                !matchesFullDesc &&
                !matchesCategory

                return false;

            // Crypto filter
            if (selectedCrypto !== "All" && p.crypto !== selectedCrypto)
              return false;

            // Price range filter
            const priceUSD = cryptoToUSD(p.price, p.crypto);
            if (
              priceUSD < selectedPriceRange.min ||
              priceUSD > selectedPriceRange.max
            )
              return false;

            // Rating filter
            if (selectedRating !== "All Ratings") {
              const minRating = parseFloat(selectedRating);
              if (p.rating < minRating) return false;

            return true;

                  if (newQty <= 0) return null; // Will be filtered out
                  return { ...i, qty: newQty };

                console.warn("Could not store pending order:", storageErr);

                )}
              </div>

              {/* Filters Row */}
              <div className="flex flex-wrap gap-2">
                {/* Category Filter */}
                <select
                  value={selectedCategory}
                  onChange={(e) => setSelectedCategory(e.target.value)}
                  className="px-3 py-2 text-xs bg-gray-900/80 border border-gray-700 rounded-lg"
                >
                  {CATEGORIES.map((cat) => (
                    <option key={cat} value={cat}>
                      {cat}
                    </option>
                  ))}
                </select>

                {/* Crypto Filter */}
                <select
                  value={selectedCrypto}
                  onChange={(e) => setSelectedCrypto(e.target.value)}
                  className="px-3 py-2 text-xs bg-gray-900/80 border border-gray-700 rounded-lg"
                >
                  {CRYPTO_TYPES.map((ct) => (
                    <option key={ct} value={ct}>
                      {ct} Only
                    </option>
                  ))}
                </select>

                {/* Price Range Filter */}
                <select
                  value={selectedPriceRange.label}
                  onChange={(e) => {
                    const selected = PRICE_RANGES.find(
                      (pr) => pr.label === e.target.value,
                    );
                    setSelectedPriceRange(selected);
                  }}
                  className="px-3 py-2 text-xs bg-gray-900/80 border border-gray-700 rounded-lg"
                >
                  {PRICE_RANGES.map((pr) => (
                    <option key={pr.label} value={pr.label}>
                      {pr.label}
                    </option>
                  ))}
                </select>

                {/* Rating Filter */}
                <select
                  value={selectedRating}
                  onChange={(e) => setSelectedRating(e.target.value)}
                  className="px-3 py-2 text-xs bg-gray-900/80 border border-gray-700 rounded-lg"
                >
                  {RATING_FILTERS.map((rf) => (
                    <option key={rf} value={rf}>
                      {rf}
                    </option>
                  ))}
                </select>

                {/* Clear All Filters */}
                <button
                  onClick={() => {
                    setSelectedCategory("All");
                    setSearchQuery("");
                    setSelectedCrypto("All");
                    setSelectedPriceRange(PRICE_RANGES[0]);
                    setSelectedRating("All Ratings");
                  }}
                  className="px-3 py-2 text-xs bg-gray-800 hover:bg-gray-700 text-gray-400 rounded-lg border border-gray-700 transition"
                >
                  <i className="fas fa-undo mr-1"></i>Clear Filters
                </button>
              </div>

              {/* Results Count */}
              <p className="text-xs text-gray-500">
                Showing {filteredProducts.length} of {PRODUCTS.length} products
              </p>
            </div>

            {/* Product Grid */}
            <main className="flex-grow px-4 md:px-8 pb-8">
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
                {filteredProducts.map((p) => {
                  const wished = isInWishlist(p.id);
                  return (
                    <div
                      key={p.id}
                      className="glass-panel neon-border rounded-xl p-4 flex flex-col hover:border-emerald-500/40 transition-all"
                    >
                      <div className="text-4xl mb-3 text-center opacity-80">
                        {p.img}
                      </div>
                      <div className="flex justify-between items-start">
                        <h3 className="font-bold text-white text-lg leading-tight">
                          {p.name}
                        </h3>
                        <button
                          onClick={() => toggleWishlist(p)}
                          className={`text-lg ${wished ? "text-pink-500" : "text-gray-500 hover:text-pink-400"}`}
                        >
                          <i
                            className={wished ? "fas fa-heart" : "far fa-heart"}
                          ></i>
                        </button>
                      </div>
                      <span className="text-xs text-emerald-400/80 bg-emerald-900/20 px-2 py-0.5 rounded self-start mt-1">
                        {p.category}
                      </span>
                      <p className="text-sm text-gray-400 mt-2 line-clamp-2">
                        {p.shortDesc}
                      </p>
                      <div className="mt-3 flex items-center justify-between">
                        <div>
                          <span className="mono-text text-amber-300 font-semibold text-sm">
                            {formatCrypto(p.price, p.crypto)}
                          </span>
                          <span className="text-xs text-gray-500 block">
                            ≈ {formatUSD(cryptoToUSD(p.price, p.crypto))}
                          </span>
                        </div>
                        <span className="text-xs text-gray-500">
                          <i className="fas fa-star text-yellow-500 text-xs"></i>{" "}
                          {p.rating}
                        </span>
                      </div>
                      <div className="flex gap-2 mt-3">
                        <button
                          onClick={() => setShowQuickview(p)}
                          className="flex-1 bg-gray-800/60 hover:bg-gray-700 border border-gray-600 text-gray-200 py-2 rounded-lg text-xs font-medium flex items-center justify-center gap-1"
                        >
                          <i className="fas fa-info-circle"></i> Quick View
                        </button>
                        <button
                          onClick={() => addToCart(p)}
                          className="flex-1 bg-emerald-900/50 hover:bg-emerald-800/60 border border-emerald-700/50 text-white py-2 rounded-lg text-xs font-medium flex items-center justify-center gap-1"
                        >
                          <i className="fas fa-cart-plus"></i> Add
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>
              {filteredProducts.length === 0 && (
                <div className="text-center mt-10">
                  <p className="text-gray-500 mono-text">
                    No tools found matching your search criteria.
                  </p>
                  <button
                    onClick={() => {
                      setSelectedCategory("All");
                      setSearchQuery("");
                      setSelectedCrypto("All");
                      setSelectedPriceRange(PRICE_RANGES[0]);
                      setSelectedRating("All Ratings");
                    }}
                    className="mt-4 px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-lg text-sm transition"
                  >
                    Clear all filters
                  </button>
                </div>
              )}
            </main>

            {/* Contact Section */}
            <section
              id="contact-section"
              className="border-t border-gray-800 py-12 px-4 md:px-8"
            >
              <div className="max-w-3xl mx-auto">
                <div className="text-center mb-8">
                  <i className="fas fa-user-secret text-5xl text-purple-400 mb-3"></i>
                  <h2 className="text-3xl font-bold mono-text text-white">
                    Request a Tool
                  </h2>
                  <p className="text-gray-400 mt-2">
                    Can't find what you need? Describe it and we'll source it.
                  </p>
                </div>
                <div className="glass-panel rounded-2xl p-6 border border-gray-700">
                  <form onSubmit={handleContactSubmit} className="space-y-5">
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <div>
                        <label className="text-xs text-gray-400 block mb-1">
                          Reason *
                        </label>
                        <select name="reason" className="w-full">
                          <option value="Special Request - Tool not listed">
                            Special Request - Tool not listed
                          </option>
                          <option value="Custom development inquiry">
                            Custom development inquiry
                          </option>
                          <option value="Bulk purchase / Partnership">
                            Bulk purchase / Partnership
                          </option>
                          <option value="Other">Other</option>
                        </select>
                      </div>
                      <div>
                        <label className="text-xs text-gray-400 block mb-1">
                          Your Email *
                        </label>
                        <input
                          type="email"
                          name="email"
                          required
                          placeholder="contact@anonmail.com"
                          className="w-full"
                        />
                      </div>
                    </div>
                    <div>
                      <label className="text-xs text-gray-400 block mb-1">
                        Describe what you need *
                      </label>
                      <textarea
                        name="description"
                        required
                        rows="4"
                        placeholder="Tool name, features, target platform, budget range..."
                        className="w-full resize-none"
                      ></textarea>
                    </div>
                    <div>
                      <label className="text-xs text-gray-400 block mb-1">
                        Social Media / Session ID (optional)
                      </label>
                      <input
                        type="text"
                        name="social"
                        placeholder="@telegram or Session ID"
                        className="w-full"
                      />
                    </div>
                    <button
                      type="submit"
                      className="w-full bg-purple-800/70 hover:bg-purple-700 text-white py-3 rounded-lg font-bold text-lg flex items-center justify-center gap-2"
                    >
                      <i className="fas fa-paper-plane"></i> Send Request
                    </button>
                  </form>
                </div>
              </div>
            </section>

            {/* Footer */}
            <footer className="border-t border-gray-800 py-4 px-6 text-center text-xs text-gray-500 flex justify-between items-center flex-wrap gap-2">
              <span>
                <i className="fas fa-shield-haltered"></i> PGP only · No direct
                contact
              </span>
              <a
                href="#contact-section"
                className="underline hover:text-purple-300"
              >
                Request a Tool
              </a>
              <span>
                <i className="fab fa-bitcoin"></i> BTC/ETH exclusive
              </span>
            </footer>

            {/* Slide Panels */}
            {showCartPanel && (
              <div
                className="fixed inset-0 z-40 flex justify-end"
                onClick={() => setShowCartPanel(false)}
              >
                <div className="absolute inset-0 bg-black/70 backdrop-blur-sm" />
                <div
                  className="relative w-full max-w-md bg-gray-900/95 backdrop-blur-xl border-l border-gray-700 h-full flex flex-col"
                  onClick={(e) => e.stopPropagation()}
                >
                  <div className="p-5 border-b border-gray-800 flex justify-between">
                    <h2 className="text-xl font-bold mono-text">
                      <i className="fas fa-cart-shopping mr-2 text-emerald-400"></i>
                      Cart ({cartItemCount})
                    </h2>
                    <button
                      onClick={() => setShowCartPanel(false)}
                      className="text-gray-400 hover:text-white text-2xl"
                    >
                      &times;
                    </button>
                  </div>
                  <div className="flex-1 overflow-y-auto p-4 space-y-4 scrollbar-thin">
                    {cart.length === 0 ? (
                      <p className="text-gray-500 text-center mt-10">
                        Cart empty.
                      </p>
                    ) : (
                      cart.map((i) => (
                        <div
                          key={i.id}
                          className="flex items-center gap-3 bg-black/30 p-3 rounded-lg border border-gray-800"
                        >
                          <span className="text-2xl">{i.img}</span>
                          <div className="flex-1">
                            <p className="text-sm font-semibold text-white">
                              {i.name}
                            </p>
                            <p className="text-xs text-gray-400">
                              {formatCrypto(i.price, i.crypto)} × {i.qty}
                            </p>
                            <p className="text-xs text-emerald-400">
                              ≈{" "}
                              {formatUSD(
                                cryptoToUSD(i.price, i.crypto) * i.qty,
                              )}
                            </p>
                          </div>
                          <div className="flex items-center gap-1">
                            <button
                              onClick={() => updateCartQty(i.id, -1)}
                              className="text-gray-500 hover:text-white bg-gray-800 rounded px-2 py-1 text-xs"
                            >
                              -
                            </button>
                            <span className="text-xs text-gray-300">
                              {i.qty}
                            </span>
                            <button
                              onClick={() => updateCartQty(i.id, 1)}
                              className="text-gray-500 hover:text-white bg-gray-800 rounded px-2 py-1 text-xs"
                            >
                              +
                            </button>
                          </div>
                          <button
                            onClick={() => removeFromCart(i.id)}
                            className="text-gray-500 hover:text-red-400"
                          >
                            <i className="fas fa-trash-alt"></i>
                          </button>
                        </div>
                      ))
                    )}
                  </div>
                  {cart.length > 0 && (
                    <div className="p-4 border-t border-gray-800">
                      <div className="space-y-2 mb-3">
                        <div className="flex justify-between text-sm">
                          <span className="text-gray-400">Total (USD):</span>
                          <span className="text-emerald-400 font-bold">
                            {formatUSD(cartTotalUSD)}
                          </span>
                        </div>
                        <div className="flex justify-between text-sm">
                          <span className="text-gray-400">Total (BTC):</span>
                          <span className="text-amber-300 font-bold mono-text">
                            {cartTotalBTC.toFixed(4)} BTC
                          </span>
                        </div>
                        <div className="flex justify-between text-sm">
                          <span className="text-gray-400">Total (ETH):</span>
                          <span className="text-amber-300 font-bold mono-text">
                            {cartTotalETH.toFixed(4)} ETH
                          </span>
                        </div>
                      </div>
                      <button
                        onClick={() => {
                          setShowCartPanel(false);
                          setShowCheckout(true);
                        }}
                        className="w-full bg-emerald-700 hover:bg-emerald-600 text-white py-2.5 rounded-lg font-bold"
                      >
                        <i className="fas fa-lock mr-2"></i>Proceed to Payment
                      </button>
                    </div>
                  )}
                </div>
              </div>
            )}

            {showWishPanel && (
              <div
                className="fixed inset-0 z-40 flex justify-end"
                onClick={() => setShowWishPanel(false)}
              >
                <div className="absolute inset-0 bg-black/70 backdrop-blur-sm" />
                <div
                  className="relative w-full max-w-md bg-gray-900/95 backdrop-blur-xl border-l border-gray-700 h-full flex flex-col"
                  onClick={(e) => e.stopPropagation()}
                >
                  <div className="p-5 border-b border-gray-800 flex justify-between">
                    <h2 className="text-xl font-bold mono-text">
                      <i className="fas fa-heart mr-2 text-pink-400"></i>
                      Wishlist ({wishlist.length})
                    </h2>
                    <button
                      onClick={() => setShowWishPanel(false)}
                      className="text-gray-400 hover:text-white text-2xl"
                    >
                      &times;
                    </button>
                  </div>
                  <div className="flex-1 overflow-y-auto p-4 space-y-4 scrollbar-thin">
                    {wishlist.length === 0 ? (
                      <p className="text-gray-500 text-center mt-10">
                        No items saved.
                      </p>
                    ) : (
                      wishlist.map((i) => (
                        <div
                          key={i.id}
                          className="flex items-center gap-3 bg-black/30 p-3 rounded-lg border border-gray-800"
                        >
                          <span className="text-2xl">{i.img}</span>
                          <div className="flex-1">
                            <p className="text-sm font-semibold text-white">
                              {i.name}
                            </p>
                            <p className="text-xs text-gray-400">
                              {formatCrypto(i.price, i.crypto)} ≈{" "}
                              {formatUSD(cryptoToUSD(i.price, i.crypto))}
                            </p>
                          </div>
                          <button
                            onClick={() => toggleWishlist(i)}
                            className="text-pink-500 hover:text-pink-300"
                          >
                            <i className="fas fa-heart-broken"></i>
                          </button>
                        </div>
                      ))
                    )}
                  </div>
                </div>
              </div>
            )}

            {showTerms && <TermsModal />}
            {showQuickview && <QuickviewModal />}
            {showCheckout && <CheckoutModal />}
            {showSuccess && <SuccessModal />}
          </div>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<ShadowHaven />);
    </script>
  </body>
</html>
