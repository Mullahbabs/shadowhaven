        const params = { reason, description: desc, user_email: email, social_media: social || "N/A" };
        try { await emailjs.send("YOUR_SERVICE_ID", "YOUR_CONTACT_TEMPLATE_ID", params); setNotification("✔ Request submitted. We'll reach out if we can source it."); form.reset(); }
        catch (err) { setNotification("✔ Request received (offline mode). We'll review it."); form.reset(); }
      };

      const handleContinueShopping = () => {
        setShowSuccess(false);
        clearCart();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      // ---------- MODALS ----------
      const DisclaimerModal = () => (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay">
          <div className="glass-panel rounded-2xl max-w-lg w-full p-6 border border-red-700/50 text-center" onClick={e => e.stopPropagation()}>
            <i className="fas fa-exclamation-triangle text-5xl text-red-400 mb-4"></i>
            <h2 className="text-xl font-bold text-white mb-3">Educational Purposes Only</h2>
            <p className="text-gray-300 text-sm mb-4">All tools and materials listed on ShadowHaven are intended strictly for educational and research purposes. The vendors and platform operators do not condone illegal activities. By proceeding, you acknowledge that you are responsible for complying with all applicable laws in your jurisdiction.</p>
            <button onClick={() => setShowDisclaimer(false)} className="bg-red-700/70 hover:bg-red-600 text-white py-2.5 px-8 rounded-lg font-bold transition">
              I Understand, Proceed
            </button>
          </div>
        </div>
      );

      const TermsModal = () => (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay" onClick={() => setShowTerms(false)}>
          <div className="glass-panel rounded-2xl max-w-2xl w-full p-6 border border-gray-700 max-h-[85vh] overflow-y-auto scrollbar-thin" onClick={e => e.stopPropagation()}>
            <div className="flex justify-between mb-4"><h2 className="text-xl font-bold mono-text text-emerald-400"><i className="fas fa-skull mr-2"></i>Terms & Operational Silence</h2><button onClick={() => setShowTerms(false)} className="text-gray-400 hover:text-white text-2xl">&times;</button></div>
            <div className="space-y-3 text-sm text-gray-300"><p><span className="text-emerald-300 font-semibold">1.</span> No physical address. Crypto only (BTC/ETH).</p><p><span className="text-emerald-300 font-semibold">2.</span> All sales final. No refunds.</p><p><span className="text-emerald-300 font-semibold">3.</span> We don't store IPs or personal data. PGP disputes only.</p><p className="text-red-400/80 italic mt-4"><i className="fas fa-exclamation-triangle"></i> Educational purposes only.</p></div>
            <button onClick={() => setShowTerms(false)} className="mt-6 w-full bg-gray-800 hover:bg-gray-700 py-2 rounded-lg">I understand</button>
          </div>
        </div>
      );

      const QuickviewModal = () => {
        if (!showQuickview) return null; const p = showQuickview;
        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay" onClick={() => setShowQuickview(null)}>
            <div className="glass-panel rounded-2xl max-w-lg w-full p-6 border border-emerald-800/40 max-h-[85vh] overflow-y-auto scrollbar-thin" onClick={e => e.stopPropagation()}>
              <div className="flex justify-between items-start mb-3"><div className="flex items-center gap-3"><span className="text-4xl">{p.img}</span><div><h3 className="text-xl font-bold text-white">{p.name}</h3><span className="text-xs text-emerald-400 bg-emerald-900/30 px-2 py-0.5 rounded">{p.category}</span></div></div><button onClick={() => setShowQuickview(null)} className="text-gray-400 hover:text-white text-2xl">&times;</button></div>
              <div className="bg-black/30 p-4 rounded-xl border border-gray-700 mb-4"><p className="text-sm text-gray-300 leading-relaxed whitespace-pre-line">{p.fullDesc}</p></div>
              <div className="flex justify-between items-center"><span className="mono-text text-amber-300 font-bold">{formatCrypto(p.price, p.crypto)}</span><span className="text-xs text-gray-400"><i className="fas fa-star text-yellow-500"></i> {p.rating}</span></div>
              <button onClick={() => { addToCart(p); setShowQuickview(null); }} className="mt-4 w-full bg-emerald-800/70 hover:bg-emerald-700 text-white py-2 rounded-lg"><i className="fas fa-cart-plus mr-2"></i>Add to Cart</button>
            </div>
          </div>
        );
      };

      const CheckoutModal = () => (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay" onClick={() => setShowCheckout(false)}>
          <div className="glass-panel rounded-2xl max-w-xl w-full p-6 border border-gray-700 max-h-[90vh] overflow-y-auto scrollbar-thin" onClick={e => e.stopPropagation()}>
            <div className="flex justify-between mb-4"><h2 className="text-xl font-bold mono-text text-amber-300"><i className="fab fa-bitcoin mr-2"></i>Crypto Checkout</h2><button onClick={() => setShowCheckout(false)} className="text-gray-400 hover:text-white text-2xl">&times;</button></div>
            <div className="space-y-3 mb-5">
              {Object.entries(WALLETS).map(([coin, data]) => (
                <div key={coin} className="wallet-box">
                  <div className="flex justify-between items-center text-xs text-gray-400 mb-1">
                    <span className="font-bold text-amber-200">{coin}</span>
                    <span>{data.network}</span>
                  </div>
                  <div className="flex items-center gap-2">
                    <p className="mono-text text-sm text-emerald-300 break-all select-all bg-black/30 p-2 rounded flex-1">{data.address}</p>
                    <button onClick={() => copyToClipboard(data.address, coin)} className="copy-btn bg-gray-700 hover:bg-gray-600 text-white p-2 rounded-lg text-xs flex items-center gap-1">
                      {copiedAddress === coin ? <><i className="fas fa-check text-green-400"></i> Copied</> : <><i className="far fa-copy"></i> Copy</>}
                    </button>
                  </div>
                </div>
              ))}
            </div>
            <form onSubmit={handleCheckoutSubmit} className="space-y-4">
              <div><label className="text-xs text-gray-400 block mb-1">Email Address *</label><input type="email" name="email" required placeholder="you@proton.me" className="w-full" /></div>
              <div><label className="text-xs text-gray-400 block mb-1">Social Media / Session ID (optional)</label><input type="text" name="social" placeholder="@telegram or Tox ID" className="w-full" /></div>
              <label className="flex items-start gap-2 text-sm text-gray-300 cursor-pointer"><input type="checkbox" checked={checkoutAgreed} onChange={e => setCheckoutAgreed(e.target.checked)} className="mt-1 accent-emerald-500" /><span>I agree to the <button type="button" onClick={() => { setShowCheckout(false); setTimeout(() => setShowTerms(true), 100); }} className="text-emerald-400 underline">terms</button>. Non-refundable.</span></label>
              <button type="submit" disabled={!checkoutAgreed || cart.length===0 || paymentLoading} className={`w-full py-2.5 rounded-lg font-bold flex items-center justify-center gap-2 transition ${checkoutAgreed && cart.length>0 && !paymentLoading ? 'bg-emerald-700 hover:bg-emerald-600 text-white' : 'bg-gray-700 text-gray-500 cursor-not-allowed'}`}>
                {paymentLoading ? <><span className="loading-spinner"></span> Processing...</> : <><i className="fas fa-check-circle"></i> I've made my payment</>}
              </button>
            </form>
          </div>
        </div>
      );

      const SuccessModal = () => (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay" onClick={handleContinueShopping}>
          <div className="glass-panel rounded-2xl max-w-md w-full p-6 text-center border border-emerald-700" onClick={e => e.stopPropagation()}>
            <i className="fas fa-check-circle text-5xl text-emerald-400 mb-3"></i>
            <h3 className="text-xl font-bold text-white mb-2">Payment Submitted</h3>
            <p className="text-gray-300 text-sm mb-4">Your purchase will be validated upon payment confirmation. Check your email for details.</p>
            <button onClick={handleContinueShopping} className="bg-emerald-700 hover:bg-emerald-600 text-white py-2 px-6 rounded-lg font-medium transition">
              Continue Shopping
            </button>
          </div>
        </div>
      );

      return (
        <div className="min-h-screen flex flex-col relative">
          {/* Disclaimer Popup */}
          {showDisclaimer && <DisclaimerModal />}

          {notification && (<div className="fixed top-5 right-5 z-40 bg-black/80 backdrop-blur-md border border-emerald-700 text-emerald-300 px-5 py-3 rounded-lg shadow-2xl mono-text text-sm flex items-center gap-2"><i className="fas fa-terminal"></i> {notification}</div>)}

          {/* Trust Ticker */}
          <div className="bg-black/60 border-b border-gray-800 py-2 ticker-wrapper">
            <div className="ticker-content text-xs text-emerald-400/80 mono-text flex gap-8">
              {[...TICKER_MESSAGES, ...TICKER_MESSAGES].map((msg, i) => <span key={i} className="inline-block">{msg}</span>)}
            </div>
          </div>

          {/* Header */}
          <header className="glass-panel sticky top-0 z-30 border-b border-gray-800 px-4 md:px-8 py-3 flex items-center justify-between flex-wrap gap-3">
            <div className="flex items-center gap-3"><i className="fas fa-spider text-3xl text-emerald-500" /><h1 className="text-2xl md:text-3xl font-bold mono-text text-white">SHADOW<span className="text-emerald-400">HAVEN</span></h1></div>
            <div className="flex items-center gap-3 md:gap-5">
              <button onClick={() => setShowWishPanel(true)} className="relative text-gray-300 hover:text-pink-400 text-xl"><i className="far fa-heart"></i>{wishlist.length>0 && <span className="absolute -top-2 -right-3 bg-pink-700 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center">{wishlist.length}</span>}</button>
              <button onClick={() => setShowCartPanel(true)} className="relative text-gray-300 hover:text-emerald-400 text-xl"><i className="fas fa-shopping-cart"></i>{cartItemCount>0 && <span className="absolute -top-2 -right-3 bg-emerald-600 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center">{cartItemCount}</span>}</button>
              <button onClick={() => setShowTerms(true)} className="text-xs text-gray-400 hover:text-white underline hidden sm:inline">Terms</button>
            </div>
          </header>

          {/* Category Filter */}
          <div className="px-4 md:px-8 py-4 flex flex-wrap gap-2">
            {CATEGORIES.map(cat => (<button key={cat} onClick={() => setSelectedCategory(cat)} className={`px-4 py-1.5 rounded-full text-xs font-medium transition border ${selectedCategory===cat ? 'bg-emerald-900/60 border-emerald-500 text-emerald-200' : 'border-gray-700 text-gray-400 hover:border-gray-500'}`}>{cat}</button>))}
          </div>

          {/* Product Grid */}
          <main className="flex-grow px-4 md:px-8 pb-8">
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
              {filteredProducts.map(p => { const wished = isInWishlist(p.id); return (
                <div key={p.id} className="glass-panel neon-border rounded-xl p-4 flex flex-col hover:border-emerald-500/40 transition-all">
                  <div className="text-4xl mb-3 text-center opacity-80">{p.img}</div>
                  <div className="flex justify-between items-start"><h3 className="font-bold text-white text-lg leading-tight">{p.name}</h3><button onClick={() => toggleWishlist(p)} className={`text-lg ${wished ? 'text-pink-500' : 'text-gray-500 hover:text-pink-400'}`}><i className={wished ? 'fas fa-heart' : 'far fa-heart'}></i></button></div>
                  <span className="text-xs text-emerald-400/80 bg-emerald-900/20 px-2 py-0.5 rounded self-start mt-1">{p.category}</span>
                  <p className="text-sm text-gray-400 mt-2 line-clamp-2">{p.shortDesc}</p>
                  <div className="mt-3 flex items-center justify-between"><span className="mono-text text-amber-300 font-semibold text-sm">{formatCrypto(p.price, p.crypto)}</span><span className="text-xs text-gray-500"><i className="fas fa-star text-yellow-500 text-xs"></i> {p.rating}</span></div>
                  <div className="flex gap-2 mt-3">
                    <button onClick={() => setShowQuickview(p)} className="flex-1 bg-gray-800/60 hover:bg-gray-700 border border-gray-600 text-gray-200 py-2 rounded-lg text-xs font-medium flex items-center justify-center gap-1"><i className="fas fa-info-circle"></i> Quick View</button>
                    <button onClick={() => addToCart(p)} className="flex-1 bg-emerald-900/50 hover:bg-emerald-800/60 border border-emerald-700/50 text-white py-2 rounded-lg text-xs font-medium flex items-center justify-center gap-1"><i className="fas fa-cart-plus"></i> Add</button>
                  </div>
                </div>
              )})}
            </div>
            {filteredProducts.length === 0 && <p className="text-center text-gray-500 mt-10 mono-text">No tools found in this category.</p>}
          </main>

          {/* Contact Section */}
          <section id="contact-section" className="border-t border-gray-800 py-12 px-4 md:px-8">
            <div className="max-w-3xl mx-auto">
              <div className="text-center mb-8"><i className="fas fa-user-secret text-5xl text-purple-400 mb-3"></i><h2 className="text-3xl font-bold mono-text text-white">Request a Tool</h2><p className="text-gray-400 mt-2">Can't find what you need? Describe it and we'll source it.</p></div>
              <div className="glass-panel rounded-2xl p-6 border border-gray-700">
                <form onSubmit={handleContactSubmit} className="space-y-5">
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div><label className="text-xs text-gray-400 block mb-1">Reason *</label><select name="reason" className="w-full"><option value="Special Request - Tool not listed">Special Request - Tool not listed</option><option value="Custom development inquiry">Custom development inquiry</option><option value="Bulk purchase / Partnership">Bulk purchase / Partnership</option><option value="Other">Other</option></select></div>
                    <div><label className="text-xs text-gray-400 block mb-1">Your Email *</label><input type="email" name="email" required placeholder="contact@anonmail.com" className="w-full" /></div>
                  </div>
                  <div><label className="text-xs text-gray-400 block mb-1">Describe what you need *</label><textarea name="description" required rows="4" placeholder="Tool name, features, target platform, budget range..." className="w-full resize-none"></textarea></div>
                  <div><label className="text-xs text-gray-400 block mb-1">Social Media / Session ID (optional)</label><input type="text" name="social" placeholder="@telegram or Session ID" className="w-full" /></div>
                  <button type="submit" className="w-full bg-purple-800/70 hover:bg-purple-700 text-white py-3 rounded-lg font-bold text-lg flex items-center justify-center gap-2"><i className="fas fa-paper-plane"></i> Send Request</button>
                </form>
              </div>
            </div>
          </section>

          {/* Footer */}
          <footer className="border-t border-gray-800 py-4 px-6 text-center text-xs text-gray-500 flex justify-between items-center flex-wrap gap-2">
            <span><i className="fas fa-shield-haltered"></i> PGP only · No direct contact</span>
            <a href="#contact-section" className="underline hover:text-purple-300">Request a Tool</a>
            <span><i className="fab fa-bitcoin"></i> BTC/ETH exclusive</span>
          </footer>

          {/* Slide Panels */}
          {showCartPanel && (
            <div className="fixed inset-0 z-40 flex justify-end" onClick={() => setShowCartPanel(false)}>
              <div className="absolute inset-0 bg-black/70 backdrop-blur-sm" />
              <div className="relative w-full max-w-md bg-gray-900/95 backdrop-blur-xl border-l border-gray-700 h-full flex flex-col" onClick={e => e.stopPropagation()}>
                <div className="p-5 border-b border-gray-800 flex justify-between"><h2 className="text-xl font-bold mono-text"><i className="fas fa-cart-shopping mr-2 text-emerald-400"></i>Cart ({cartItemCount})</h2><button onClick={() => setShowCartPanel(false)} className="text-gray-400 hover:text-white text-2xl">&times;</button></div>
                <div className="flex-1 overflow-y-auto p-4 space-y-4 scrollbar-thin">{cart.length===0 ? <p className="text-gray-500 text-center mt-10">Cart empty.</p> : cart.map(i => (<div key={i.id} className="flex items-center gap-3 bg-black/30 p-3 rounded-lg border border-gray-800"><span className="text-2xl">{i.img}</span><div className="flex-1"><p className="text-sm font-semibold text-white">{i.name}</p><p className="text-xs text-gray-400">{formatCrypto(i.price, i.crypto)} x {i.qty}</p></div><button onClick={() => removeFromCart(i.id)} className="text-gray-500 hover:text-red-400"><i className="fas fa-trash-alt"></i></button></div>))}</div>
                {cart.length>0 && (<div className="p-4 border-t border-gray-800"><div className="flex justify-between text-sm mb-3"><span>Estimated:</span><span className="mono-text text-amber-300 font-bold">{cart.reduce((a,i)=>a+i.price*i.qty,0).toFixed(4)} crypto</span></div><button onClick={()=>{setShowCartPanel(false); setShowCheckout(true);}} className="w-full bg-emerald-700 hover:bg-emerald-600 text-white py-2.5 rounded-lg font-bold"><i className="fas fa-lock mr-2"></i>Proceed to Payment</button></div>)}
              </div>
            </div>
          )}
          {showWishPanel && (
            <div className="fixed inset-0 z-40 flex justify-end" onClick={() => setShowWishPanel(false)}>
              <div className="absolute inset-0 bg-black/70 backdrop-blur-sm" />
              <div className="relative w-full max-w-md bg-gray-900/95 backdrop-blur-xl border-l border-gray-700 h-full flex flex-col" onClick={e => e.stopPropagation()}>
                <div className="p-5 border-b border-gray-800 flex justify-between"><h2 className="text-xl font-bold mono-text"><i className="fas fa-heart mr-2 text-pink-400"></i>Wishlist ({wishlist.length})</h2><button onClick={() => setShowWishPanel(false)} className="text-gray-400 hover:text-white text-2xl">&times;</button></div>
                <div className="flex-1 overflow-y-auto p-4 space-y-4 scrollbar-thin">{wishlist.length===0 ? <p className="text-gray-500 text-center mt-10">No items saved.</p> : wishlist.map(i => (<div key={i.id} className="flex items-center gap-3 bg-black/30 p-3 rounded-lg border border-gray-800"><span className="text-2xl">{i.img}</span><div className="flex-1"><p className="text-sm font-semibold text-white">{i.name}</p><p className="text-xs text-gray-400">{formatCrypto(i.price, i.crypto)}</p></div><button onClick={() => toggleWishlist(i)} className="text-pink-500 hover:text-pink-300"><i className="fas fa-heart-broken"></i></button></div>))}</div>
              </div>
            </div>
          )}

          {showTerms && <TermsModal />}
          {showQuickview && <QuickviewModal />}
          {showCheckout && <CheckoutModal />}
          {showSuccess && <SuccessModal />}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ShadowHaven />);
  </script>
</body>
</html>
